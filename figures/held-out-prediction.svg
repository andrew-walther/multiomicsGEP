<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 246" role="img">
<title>Evaluate frozen YFB predictions on new patients</title>
<rect width="100%" height="100%" rx="12" fill="#f5f8fc"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#395775"/></marker></defs>
<text x="24" y="37" font-family="system-ui,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#102a43">Evaluate frozen YFB predictions on new patients</text>
<rect x="18" y="60" width="1104" height="162" rx="12" fill="white" stroke="#b4c7da"/>
<text x="34" y="87" font-family="system-ui,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#102a43">For a fixed fit, held-out outcomes evaluate its predictions</text>
<rect x="34" y="102" width="244" height="80" rx="8" fill="#e7f1fc"/>
<text x="156" y="124" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#102a43">Align molecular inputs</text>
<text x="156" y="147" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Apply benchmark preprocessing</text>
<text x="156" y="168" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Match held-out genes to F</text>
<path d="M280 142h21" stroke="#395775" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="305" y="102" width="244" height="80" rx="8" fill="#e7f5ed"/>
<text x="427" y="124" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#102a43">Project new patients</text>
<text x="427" y="147" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Z* = Y*F̃</text>
<text x="427" y="168" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">F̃ uses training norms</text>
<path d="M551 142h21" stroke="#395775" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="576" y="102" width="244" height="80" rx="8" fill="#fff2d9"/>
<text x="698" y="124" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#102a43">Score risk</text>
<text x="698" y="147" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">η* = Z*β̂</text>
<text x="698" y="168" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Use frozen coefficients</text>
<path d="M822 142h21" stroke="#395775" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="847" y="102" width="244" height="80" rx="8" fill="#eeeafa"/>
<text x="969" y="124" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#102a43">Evaluate discrimination</text>
<text x="969" y="147" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Compare η* with (t*, δ*)</text>
<text x="969" y="168" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Compute cohort C-index</text>
<text x="34" y="207" font-family="system-ui,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#102a43">Held-out outcomes enter evaluation. Use the training-fixed risk orientation for concordance.</text>
</svg>
