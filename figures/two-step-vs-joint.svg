<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 424" role="img">
<title>How survival enters molecular factor learning</title>
<rect width="100%" height="100%" rx="12" fill="#f5f8fc"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#395775"/></marker></defs>
<text x="24" y="37" font-family="system-ui,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#102a43">How survival enters molecular factor learning</text>
<rect x="18" y="60" width="1104" height="162" rx="12" fill="white" stroke="#b4c7da"/>
<text x="34" y="87" font-family="system-ui,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#102a43">A  Two-step EBMF followed by Cox regression</text>
<rect x="34" y="102" width="244" height="80" rx="8" fill="#e7f1fc"/>
<text x="156" y="124" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#102a43">Molecular data</text>
<text x="156" y="147" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Expression Y</text>
<text x="156" y="168" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Training patients</text>
<path d="M280 142h21" stroke="#395775" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="305" y="102" width="244" height="80" rx="8" fill="#e7f5ed"/>
<text x="427" y="124" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#102a43">Fit EBMF</text>
<text x="427" y="147" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Learn L and F from Y</text>
<text x="427" y="168" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Fix the representation</text>
<path d="M551 142h21" stroke="#395775" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="576" y="102" width="244" height="80" rx="8" fill="#fff2d9"/>
<text x="698" y="124" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#102a43">Fit Cox regression</text>
<text x="698" y="147" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Use fixed factor scores</text>
<text x="698" y="168" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Estimate coefficients β</text>
<path d="M844 142h-21" stroke="#395775" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="847" y="102" width="244" height="80" rx="8" fill="#eeeafa"/>
<text x="969" y="124" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#102a43">Predict risk</text>
<text x="969" y="147" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Use the fixed representation</text>
<text x="969" y="168" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Evaluate on held-out patients</text>
<text x="34" y="207" font-family="system-ui,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#102a43">Survival outcomes enter the Cox stage. They can select score coefficients while the learned factors stay fixed.</text>
<rect x="18" y="238" width="1104" height="162" rx="12" fill="white" stroke="#b4c7da"/>
<text x="34" y="265" font-family="system-ui,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#102a43">B  Proposed joint EBMF and Cox model</text>
<rect x="34" y="280" width="244" height="80" rx="8" fill="#e7f1fc"/>
<text x="156" y="302" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#102a43">Paired training data</text>
<text x="156" y="325" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Expression Y</text>
<text x="156" y="346" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Time and event indicator</text>
<path d="M280 320h21" stroke="#395775" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="305" y="280" width="244" height="80" rx="8" fill="#e7f5ed"/>
<text x="427" y="302" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#102a43">Molecular term</text>
<text x="427" y="325" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Learn L and F from Y</text>
<text x="427" y="346" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Preserve reconstruction</text>
<path d="M551 320h21" stroke="#395775" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="576" y="280" width="244" height="80" rx="8" fill="#fff2d9"/>
<text x="698" y="302" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#102a43">Cox survival term</text>
<text x="698" y="325" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">YFB uses projected scores</text>
<text x="698" y="346" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">LB uses patient scores</text>
<path d="M822 320h21" stroke="#395775" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="847" y="280" width="244" height="80" rx="8" fill="#eeeafa"/>
<text x="969" y="302" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#102a43">Joint updates</text>
<text x="969" y="325" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Update factors and β</text>
<text x="969" y="346" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Check recovery and stability</text>
<path d="M970 361v7H430v-7" fill="none" stroke="#395775" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="34" y="385" font-family="system-ui,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#102a43">Survival can influence the factors learned. The intended benefit still needs to pass the registered simulation gate.</text>
</svg>
