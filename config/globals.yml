# ==============================================================================
# globals.yml — multiomicsGEP
# Purpose:   Single source of truth for hard-coded parameters across the
#            simulation runner, fit_modular.R, and select_K.R.
#            Load with: cfg <- yaml::read_yaml("config/globals.yml")
# ==============================================================================

# ------------------------------------------------------------------------------
# CAVI fitting
# ------------------------------------------------------------------------------
cavi:
  max_iter: 300        # maximum outer CAVI iterations
  tol: 1.0e-5          # convergence threshold: relative full-ELBO change < tol
  burn_in: 5           # iterations before convergence is checked
  k_default: 5         # default number of factors (fixed-K runs)
  k_max: 10            # maximum K for auto-prune runs
  alpha_grid: [0.0, 0.1, 0.3, 0.5, 0.7, 0.9, 1.0]
  n_cv_folds: 5
  # lambda: survival-term scale multiplier.  1.0 = no correction.
  # sandbox (2026-04-24): lambda=1 matches or beats p/n and 2p/n on C-index and beta RMSE.
  # To test other values: try p/n (~5 for n=250,p=1000) or 2*p/n.
  lambda: 1.0

# ------------------------------------------------------------------------------
# K selection / auto-prune thresholds
# ------------------------------------------------------------------------------
k_selection:
  pve_threshold: 0.01    # minimum PVE (1%) to retain a factor
  beta_threshold: 0.001  # minimum |beta| to retain a factor. Lowered from 0.05: under YFB
                         # (eta = ZF * beta_tilde), natural EBeta scale is ~0.003–0.008
                         # (beta_true / sd(ZF)) — 0.05 would count all YFB betas as inactive.
                         # 0.001 distinguishes non-zero from spike-shrunk betas in both models.

# ------------------------------------------------------------------------------
# Synthetic simulation
# ------------------------------------------------------------------------------
synthetic:
  "n": 250
  p: 1000
  k_true: 5
  seed: 222              # seed 222: clean factor separation, null factor correctly zeroed
  b_true: [1.5, -1.2, 0.8, -0.5, 0.0]

# ------------------------------------------------------------------------------
# Preprocessing
# ------------------------------------------------------------------------------
preprocessing:
  top_n_genes: 2000      # DeSurv spec: top-2000 most variable genes per cohort.
                         # Reverted from 5000: archived baseline (C=0.60-0.65, tcga_only) used
                         # 2000 genes; 5000 added noise that degraded single-cohort performance.
  top_n_genes_desurv: 3000   # DeSurv (Young et al. 2025): top-3000 per cohort by combined
                              # mean+variance rank, then intersect. Yields ~1970 after intersection
                              # (vs 2000 variance-only). See DECISIONS.md 2026-05-27.
  center_columns: true
  batch_correct: true

# ------------------------------------------------------------------------------
# Benchmark runner defaults (run_LB_benchmark.R, run_YFB_benchmark.R)
# ------------------------------------------------------------------------------
benchmark:
  k_pdac: 20             # K_max for PDAC merged-cohort fits (TCGA_PAAD + CPTAC, n=273).
                         # LB merged uses K=20 (ARD prunes to K_eff=2-4).
  # CV-selected K for merged training (TCGA_PAAD + CPTAC) — filled by run_merged_kcv.R
  # Format: k_merged_<model>_<preprocessing>
  # null = K-CV not yet run; run_merged_benchmark.R will stop with an informative error.
  k_merged_lb_joint:        6   # LB, joint quantile+rank preprocessing (M1, M2)
  k_merged_lb_perplatform:  3   # LB, per-platform z-std preprocessing (M3, M4)
  k_merged_yfb_perplatform: 3   # YFB, per-platform z-std preprocessing (M5, M6)
                                # NOTE: 1-SE selected K=2; biological floor (K>=3) applied.
                                # K=3 has higher CV mean C (0.634 vs 0.625) and lower SE.
  # New preprocessing options — filled by run_merged_kcv.R (biological floor K>=3 applied)
  k_merged_lb_joint_norank:     6  # LB,  joint quantile, no rank transform (M7, M8)
  k_merged_yfb_joint_norank:    5  # YFB, joint quantile, no rank transform (M13, M14)
  k_merged_lb_zstd:             3  # LB,  joint z-standardization (M9, M10)
  k_merged_yfb_zstd:            3  # YFB, joint z-standardization (M15, M16)
  k_merged_lb_logonly:          3  # LB,  log transform only (M11, M12)
  k_merged_yfb_logonly:         3  # YFB, log transform only (M17, M18)
  # DeSurv-aligned configs — filled by run_desurv_comparison.R
  k_merged_lb_desurv:  4   # LB  + per-platform z-std + combined_rank + top-3000 per-cohort
  k_merged_yfb_desurv: 3   # YFB + per-platform z-std + combined_rank + top-3000 per-cohort
  k_pdac_yfb_merged: 3   # K for YFB merged-cohort fits (rank_transform=FALSE).
                         # Diagnostic sweep (2026-05-06): K=3 gives highest median external C
                         # (0.644); K_eff=3 across K=3-14, all factors survive at K=3.
                         # Consistent with DeSurv (Young et al. 2025) K=3 and prior 1-SE CV.
  k_pdac_single: 10      # K_max for single-cohort PDAC fits (tcga_only, cptac_only).
                         # Archived baseline (C=0.63-0.65 on tcga_only) used K=10.
                         # K=20 on tcga_only (n=144) gives K_eff=1 and C=0.37-0.50 (2026-05-05).
  k_pdac_synthetic: 5    # K_max for synthetic validation. Must equal K_true=5.
                         # K=8 (previously tried) gave C=0.135 LB / C=0.092 YFB — anti-concordant.
                         # ARD with K>K_true absorbs signal variance into null factors, causing
                         # the factorization to miss survival-relevant directions.
  n_burnin: 0            # Beta-only burn-in iterations before joint CAVI. 0 = off (baseline).
                         # Tried: N_burnin=10 (Cluster A smoke); marginal or negative effect
                         # on external C-index vs. baseline. Keep 0 for clean comparison.
  normalize_ab: false    # Rescale survival vs. genomics contributions in L update (Cluster A)
                         # or F update (Cluster B, only effective when alpha_F > 0).
                         # Tried: TRUE in Cluster A smoke — mixed external results, 4/5 cohorts
                         # regressed. Keep FALSE for baseline.
  cox_warmstart: false   # Cox-based EBeta initialization in Cluster B (fit_cox_on_yf).
                         # FALSE = matches Cluster A behavior (EBeta starts at 0). Toggleable
                         # for experiments; effect unclear with normal prior.
  prior_beta_compare:    # Both priors run in each benchmark for side-by-side comparison.
    - "point_normal"     # Spike-and-slab: promotes sparsity; collapses to beta=0 when ZF
                         # scale is large and signal is weak (observed on merged PDAC data).
    - "normal"           # Pure Gaussian: no spike; avoids beta=0 collapse but may retain
                         # too many active factors. Trade-off unclear — run both and compare.
  alpha: 0.5             # Survival mixing weight. 0.5 validated as best by CV; alpha grid
                         # tested: [0.0, 0.1, 0.3, 0.5, 0.7, 0.9, 1.0].
  lambda: 1.0            # Survival-term scale multiplier. lambda=1 matches or beats p/n and
                         # 2p/n on C-index and beta RMSE (sandbox test 2026-04-24).

# ------------------------------------------------------------------------------
# PDAC data — cohort registry and platform flags
# ------------------------------------------------------------------------------
pdac:
  training_cohorts: ["TCGA_PAAD", "CPTAC"]
  external_cohorts: ["Dijk", "Moffitt_GEO_array", "PACA_AU_array", "PACA_AU_seq", "Puleo_array"]
  # Default local path; override with PDAC_DATA_ROOT env var
  data_root_default: "~/OneDrive - University of North Carolina at Chapel Hill/UNC Dissertation (Liu)/PDAC_data"
  # TRUE = RNA-seq (raw counts → apply log2(x+1)); FALSE = Proteomics/Microarray (already normalised)
  platform_log_transform:
    TCGA_PAAD: true
    CPTAC: false
    Dijk: true
    Moffitt_GEO_array: false
    PACA_AU_array: false
    PACA_AU_seq: true
    Puleo_array: false

# ------------------------------------------------------------------------------
# Evaluation
# ------------------------------------------------------------------------------
evaluation:
  holdout_frac: 0.2      # fraction of data held out for test set
  holdout_seed: 42       # seed for stratified_split()
  n_init: 1              # >1 activates multi-init with best-ELBO selection
  multi_init_seed_base: 42  # set.seed(multi_init_seed_base + init_i) for each init
