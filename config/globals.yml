# ==============================================================================
# globals.yml — multiomicsGEP
# Purpose:   Single source of truth for hard-coded parameters across the
#            simulation runner, fit_modular.R, and select_K.R.
#            Load with: cfg <- yaml::read_yaml("config/globals.yml")
# ==============================================================================

# ------------------------------------------------------------------------------
# CAVI fitting
# ------------------------------------------------------------------------------
cavi:
  max_iter: 300        # maximum outer CAVI iterations
  tol: 1.0e-5          # convergence threshold: relative full-ELBO change < tol
  burn_in: 5           # iterations before convergence is checked
  k_default: 5         # default number of factors (fixed-K runs)
  k_max: 10            # maximum K for auto-prune runs
  alpha_grid: [0.0, 0.1, 0.3, 0.5, 0.7, 0.9, 1.0]
  n_cv_folds: 5
  # lambda: survival-term scale multiplier.  1.0 = no correction.
  # sandbox (2026-04-24): lambda=1 matches or beats p/n and 2p/n on C-index and beta RMSE.
  # To test other values: try p/n (~5 for n=250,p=1000) or 2*p/n.
  lambda: 1.0

# ------------------------------------------------------------------------------
# K selection / auto-prune thresholds
# ------------------------------------------------------------------------------
k_selection:
  pve_threshold: 0.01    # minimum PVE (1%) to retain a factor
  beta_threshold: 0.001  # minimum |beta| to retain a factor. Lowered from 0.05: under YFB
                         # (eta = ZF * beta_tilde), natural EBeta scale is ~0.003–0.008
                         # (beta_true / sd(ZF)) — 0.05 would count all YFB betas as inactive.
                         # 0.001 distinguishes non-zero from spike-shrunk betas in both models.

# ------------------------------------------------------------------------------
# Synthetic simulation
# ------------------------------------------------------------------------------
synthetic:
  "n": 250
  p: 1000
  k_true: 5
  seed: 222              # seed 222: clean factor separation, null factor correctly zeroed
  b_true: [1.5, -1.2, 0.8, -0.5, 0.0]

# ------------------------------------------------------------------------------
# Preprocessing
# ------------------------------------------------------------------------------
preprocessing:
  top_n_genes: 5000      # NULL = no gene filter; integer = top N most-variable genes
  center_columns: true
  batch_correct: true

# ------------------------------------------------------------------------------
# Benchmark runner defaults (run_LB_benchmark.R, run_YFB_benchmark.R)
# ------------------------------------------------------------------------------
benchmark:
  k_pdac: 10             # K_max for PDAC fits. Canonical benchmark value (k_max=10 from
                         # globals cavi section); ARD pruning selects K_eff ≈ 4 in practice.
                         # K=20 was used only for Cluster A/B β=0 diagnostics — not for results.
  k_pdac_synthetic: 8    # K_max for synthetic validation in benchmark runners.
                         # K_true=5 in DGP; K_max=8 gives ARD room to prune correctly.
  n_burnin: 0            # Beta-only burn-in iterations before joint CAVI. 0 = off (baseline).
                         # Tried: N_burnin=10 (Cluster A smoke); marginal or negative effect
                         # on external C-index vs. baseline. Keep 0 for clean comparison.
  normalize_ab: false    # Rescale survival vs. genomics contributions in L update (Cluster A)
                         # or F update (Cluster B, only effective when alpha_F > 0).
                         # Tried: TRUE in Cluster A smoke — mixed external results, 4/5 cohorts
                         # regressed. Keep FALSE for baseline.
  cox_warmstart: false   # Cox-based EBeta initialization in Cluster B (fit_cox_on_yf).
                         # FALSE = matches Cluster A behavior (EBeta starts at 0). Toggleable
                         # for experiments; effect unclear with normal prior.
  prior_beta_compare:    # Both priors run in each benchmark for side-by-side comparison.
    - "point_normal"     # Spike-and-slab: promotes sparsity; collapses to beta=0 when ZF
                         # scale is large and signal is weak (observed on merged PDAC data).
    - "normal"           # Pure Gaussian: no spike; avoids beta=0 collapse but may retain
                         # too many active factors. Trade-off unclear — run both and compare.
  alpha: 0.5             # Survival mixing weight. 0.5 validated as best by CV; alpha grid
                         # tested: [0.0, 0.1, 0.3, 0.5, 0.7, 0.9, 1.0].
  lambda: 1.0            # Survival-term scale multiplier. lambda=1 matches or beats p/n and
                         # 2p/n on C-index and beta RMSE (sandbox test 2026-04-24).

# ------------------------------------------------------------------------------
# Evaluation
# ------------------------------------------------------------------------------
evaluation:
  holdout_frac: 0.2      # fraction of data held out for test set
  holdout_seed: 42       # seed for stratified_split()
  n_init: 1              # >1 activates multi-init with best-ELBO selection
  multi_init_seed_base: 42  # set.seed(multi_init_seed_base + init_i) for each init
