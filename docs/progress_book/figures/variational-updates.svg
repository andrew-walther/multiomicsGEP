<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 424" role="img">
<title>How the objective becomes a fitting algorithm</title>
<rect width="100%" height="100%" rx="12" fill="#f5f8fc"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#395775"/></marker></defs>
<text x="24" y="37" font-family="system-ui,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#102a43">How the objective becomes a fitting algorithm</text>
<rect x="18" y="60" width="1104" height="162" rx="12" fill="white" stroke="#b4c7da"/>
<text x="34" y="87" font-family="system-ui,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#102a43">Objective components</text>
<rect x="34" y="102" width="244" height="80" rx="8" fill="#e7f1fc"/>
<text x="156" y="124" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#102a43">Molecular likelihood</text>
<text x="156" y="147" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Observed Y given L, F, τ</text>
<text x="156" y="168" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Residuals drive reconstruction</text>
<path d="M280 142h21" stroke="#395775" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="305" y="102" width="244" height="80" rx="8" fill="#e7f5ed"/>
<text x="427" y="124" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#102a43">Cox partial likelihood</text>
<text x="427" y="147" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Time, event and risk sets</text>
<text x="427" y="168" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">η links molecular and survival</text>
<path d="M551 142h21" stroke="#395775" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="576" y="102" width="244" height="80" rx="8" fill="#fff2d9"/>
<text x="698" y="124" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#102a43">Empirical Bayes priors</text>
<text x="698" y="147" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Separate priors for L, F, β</text>
<text x="698" y="168" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Shrink noisy coordinates</text>
<path d="M822 142h21" stroke="#395775" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="847" y="102" width="244" height="80" rx="8" fill="#eeeafa"/>
<text x="969" y="124" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#102a43">Variational objective</text>
<text x="969" y="147" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Expected log terms and KL</text>
<text x="969" y="168" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Working Cox approximation</text>
<text x="34" y="207" font-family="system-ui,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#102a43">The molecular and Cox weights depend on the model variant. S-9 is a planned change to the genomic weighting.</text>
<rect x="18" y="238" width="1104" height="162" rx="12" fill="white" stroke="#b4c7da"/>
<text x="34" y="265" font-family="system-ui,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#102a43">One sweep of the experimental YFB fitter</text>
<rect x="34" y="280" width="244" height="80" rx="8" fill="#e7f1fc"/>
<text x="156" y="302" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#102a43">Refresh Cox terms</text>
<text x="156" y="325" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Compute η and risk-set terms</text>
<text x="156" y="346" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Form local working quantities</text>
<path d="M280 320h21" stroke="#395775" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="305" y="280" width="244" height="80" rx="8" fill="#e7f5ed"/>
<text x="427" y="302" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#102a43">Update L and F</text>
<text x="427" y="325" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Use residuals and priors</text>
<text x="427" y="346" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Include survival terms in F</text>
<path d="M551 320h21" stroke="#395775" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="576" y="280" width="244" height="80" rx="8" fill="#fff2d9"/>
<text x="698" y="302" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#102a43">Update β and τ</text>
<text x="698" y="325" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Use projected-score moments</text>
<text x="698" y="346" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Update noise or hold it fixed</text>
<path d="M822 320h21" stroke="#395775" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="847" y="280" width="244" height="80" rx="8" fill="#eeeafa"/>
<text x="969" y="302" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#102a43">Check the fit</text>
<text x="969" y="325" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Track objective and movement</text>
<text x="969" y="346" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#102a43">Record explicit failures</text>
<text x="34" y="385" font-family="system-ui,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#102a43">Repeat until the stopping criteria are met or the fit reaches a recorded cap or failure.</text>
</svg>
